# 凭证：SAM/SECURITY/SYSTEM 注册表配置单元与凭据库
detector: credential_hive_access
name: SAM/SECURITY 配置单元或浏览器凭据访问
tactic: TA0006
technique: T1552
severity: high
score: 20
match:
  any:
    - category: file
      action: [read, open]
      target: ['*\config\SAM', '*\config\SECURITY', '*\config\SYSTEM', '*\Login Data', '*\Cookies']
    - category: process
      action: create
      arg:
        command_line: ['*reg save hklm\sam*', '*reg save hklm\security*', '*reg save hklm\system*', '*ntds.dit*', '*procdump*']
    - category: registry
      action: [query]
      target: ['*lsa\secrets*', '*SAM\Domains\Account*']
evidence: events

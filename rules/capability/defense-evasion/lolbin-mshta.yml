rule:
  meta:
    name: '滥用 mshta 执行载荷'
    namespace: 'defense-evasion/lolbin/mshta'
    scope: 'process'
    authors: [tianti]
    description: '使用 mshta.exe 执行 HTA/脚本载荷'
    att&ck:
      - 'Defense Evasion::System Binary Proxy Execution Mshta [T1218.005]'
  features:
    - process create: '*\mshta.exe'

rule:
  meta:
    name: '伪装为 lsass.exe'
    namespace: 'defense-evasion/masquerade/lsass'
    scope: 'process'
    authors: [tianti]
    description: '在非系统目录释放并使用 lsass.exe 名称伪装'
    att&ck:
      - 'Defense Evasion::Masquerading Match Legitimate Resource Name or Location [T1036.005]'
  features:
    - and:
      - process create: '*\lsass.exe'
      - not:
        - process create: 'c:\windows\system32\lsass.exe'
